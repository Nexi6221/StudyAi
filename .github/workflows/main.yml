name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Resolve Project Directory & Prepare Files
        run: |
          if [ -d "StudyAi-main" ]; then
            PROJECT_DIR="StudyAi-main"
          else
            PROJECT_DIR="."
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          cd $PROJECT_DIR

          # Generate debug keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          # Setup local.properties & .env
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # Generate Google Services file
          mkdir -p app
          echo '{
            "project_info": { "project_number": "1234567890", "project_id": "studyai-dummy", "storage_bucket": "studyai-dummy.appspot.com" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:1234567890:android:1234567890", "android_client_info": { "package_name": "com.aistudio.studymateai.kmxsqz" } },
              "oauth_client": [],
              "api_key": [{ "current_key": "dummy_api_key" }],
              "services": { "analytics_service": { "status": 1 } }
            }],
            "configuration_version": "1"
          }' > app/google-services.json

          # Generate Wrapper if missing
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleDebug -Pkotlin.version=1.9.20 -Porg.jetbrains.kotlin.android.gradle.plugin.version=1.9.20 --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyAi-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
