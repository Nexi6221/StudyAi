name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create missing build dependencies
        run: |
          # Generate default debug keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # Create matching google-services.json
          mkdir -p app
          echo '{
            "project_info": { "project_number": "1234567890", "project_id": "studyai-dummy", "storage_bucket": "studyai-dummy.appspot.com" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:1234567890:android:1234567890", "android_client_info": { "package_name": "com.aistudio.studymateai.kmxsqz" } },
              "oauth_client": [],
              "api_key": [{ "current_key": "dummy_api_key" }],
              "services": { "analytics_service": { "status": 1 } }
            }],
            "configuration_version": "1"
          }' > app/google-services.json

          # Ensure Gradle Wrapper exists
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyAi-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
